name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o TaoAutoRecorder_v0.2_fixed-1.zip
          echo "Project files:"
          find TaoAutoRecorder -maxdepth 3 -type f | sort

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: TaoAutoRecorder
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaoAutoRecorder-V0.2-APK
          path: TaoAutoRecorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
